<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 일 한눈에">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<title>내 일 한눈에</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1b1b1a;--mut:#8a877f;--line:#ebe8e1;--acc:#1f6f5c;--accbg:#e4f1ec;--warn:#c2410c;--warnbg:#fdebe1;--chip:#f0eee9}
@media (prefers-color-scheme: dark){:root{--bg:#141414;--card:#1e1e1d;--fg:#f1efea;--mut:#9a978f;--line:#2c2b29;--acc:#6cc3a8;--accbg:#1c302a;--warn:#f59a72;--warnbg:#3a231a;--chip:#2a2a28}}
*{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden}
html{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;padding:max(18px,env(safe-area-inset-top)) 16px 48px}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 16px}
h1{font-size:22px;letter-spacing:-.02em;margin:0}
.upd{font-size:12px;color:var(--mut)}
.hero{background:var(--card);border-radius:18px;padding:18px 18px 8px;margin-bottom:12px}
.hero h2{font-size:15px;color:var(--mut);font-weight:600;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border-top:0}
.row .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ag{font-size:12px;color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.warn{background:var(--warn)}.dot.acc{background:var(--acc)}
details.sec{background:var(--card);border-radius:18px;margin-bottom:12px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px}
details.sec>summary::-webkit-details-marker{display:none}
.num{font-size:30px;font-weight:700;letter-spacing:-.03em;min-width:44px;font-variant-numeric:tabular-nums}
.num.warn{color:var(--warn)}
.lab{flex:1}
.lab b{display:block;font-size:16px}
.lab span{font-size:13px;color:var(--mut)}
.chev{color:var(--mut);transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.body{padding:0 18px 10px}
details.it{border-top:1px solid var(--line)}
details.it:first-child{border-top:0}
details.it>summary{list-style:none;cursor:pointer}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary .row{border-top:0}
.more{font-size:14px;color:var(--mut);padding:0 0 12px 18px;line-height:1.55}
.more a{color:var(--acc)}
.grp{font-size:12px;color:var(--mut);font-weight:600;margin:14px 0 2px}
.grp:first-child{margin-top:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:4px 0 10px}
.kpi div{background:var(--chip);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);font-size:14px;padding:6px 0 12px}
.err{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.lock{max-width:420px;margin:15vh auto;text-align:center;color:var(--mut)}
.links{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.links a{font-size:13px;color:var(--acc);text-decoration:none;background:var(--chip);border-radius:999px;padding:4px 10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="lock">불러오는 중…</div></div>
<script>
const DATA = null;
const MODE = "remote";
const GIST = "0da8b1597c16de7d9b84ee61c9112462";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function ago(iso) {
  if (!iso) return '';
  const t = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T00:00:00+09:00') : new Date(String(iso).replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(iso) || !/T|\s\d/.test(iso) ? '' : '+09:00'));
  if (isNaN(t)) return esc(iso);
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 60 * 24) return Math.round(m / 60) + '시간 전';
  return Math.round(m / 1440) + '일 전';
}
function hm(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }); }
const li = (inner) => `<li>${inner}</li>`;
function list(items, render, emptyText, more = 6) {
  if (!items || !items.length) return `<div class="empty">${emptyText}</div>`;
  const head = items.slice(0, more).map(render).map(li).join('');
  const rest = items.slice(more);
  return `<ul>${head}</ul>` + (rest.length ? `<details><summary>${rest.length}개 더 보기</summary><ul>${rest.map(render).map(li).join('')}</ul></details>` : '');
}
function short(t, n = 34) {
  t = String(t ?? '').replace(/\s+/g, ' ').trim();
  const first = t.split(/(?<=[.。!?])\s|[.。]\s*$|\s\/\s|\s·\s|:\s/)[0] || t;
  const u = first.length >= 6 ? first : t;
  return u.length > n ? u.slice(0, n - 1) + '…' : u;
}
function item(dot, text, age, more) {
  const row = `<div class="row"><i class="dot ${dot}"></i><span class="tx">${esc(text)}</span>${age ? `<span class="ag">${age}</span>` : ''}</div>`;
  return more ? `<details class="it"><summary>${row}</summary><div class="more">${more}</div></details>` : `<div class="it">${row}</div>`;
}
function sec(id, num, warn, title, hint, inner, open) {
  return `<details class="sec" id="${id}"${open ? ' open' : ''}><summary><span class="num ${warn ? 'warn' : ''}">${num}</span><span class="lab"><b>${title}</b><span>${hint}</span></span><span class="chev">›</span></summary><div class="body">${inner}</div></details>`;
}
const mm = (s) => String(s || '').slice(5, 10).replace('-', '/');
function okItems(d) {
  const exp = d.ok.filter((x) => x.kind === '실험 판정');
  const rest = d.ok.filter((x) => x.kind !== '실험 판정');
  const out = rest.map((x) => {
    const label = x.kind === '팀 답장 초안' ? `${short(x.title.split('·')[1] || x.title, 10)}에게 답장 OK` : x.kind === '대화방' ? short(x.title, 26) : short(x.ask || x.title, 30);
    return { dot: x.kind === '대화방' ? '' : 'warn', text: label, age: ago(x.since), more: `${esc(x.ask)}${x.link ? ` · <a href="${esc(x.link)}" target="_blank">원문</a>` : ''}` };
  });
  if (exp.length) out.push({ dot: 'warn', text: `판정일 지난 실험 ${exp.length}개`, age: '', more: exp.map((x) => esc(short(x.title, 44))).join('<br>') });
  return out;
}
function render(d) {
  const a = d.auto.summary;
  const ok = okItems(d);
  const flagged = d.auto.routines.filter((g) => g.flag === '확인 필요');
  const did = [...d.done.meetings.map((x) => ({ g: '회의', ...x })), ...d.done.slack.map((x) => ({ g: '슬랙', ...x }))];
  const ov = d.results.overview[0];
  const html = `
  <header><h1>내 일 한눈에</h1><span class="upd">${hm(d.updatedAt)} 갱신</span></header>
  ${d.errors && d.errors.length ? `<div class="err">못 읽은 기록: ${d.errors.map(esc).join(' / ')}</div>` : ''}
  <div class="hero"><h2>지금 할 것</h2>
    ${ok.slice(0, 3).map((x) => item(x.dot, x.text, x.age, x.more)).join('') || '<div class="empty">기다리는 게 없어요</div>'}
  </div>
  ${sec('ok', ok.length, ok.length > 0, '내가 OK·답할 것', '위 3개 포함 전부 보기', ok.map((x) => item(x.dot, x.text, x.age, x.more)).join(''))}
  ${sec('doing', d.doing.tasks.length, false, '이번 주 할 일', `대화방 ${d.doing.sessions.length}개 움직이는 중`,
    `<div class="grp">할 일</div>${d.doing.tasks.map((x) => item(x.priority === '먼저' ? 'warn' : '', short(x.title, 30), x.due ? short(x.due, 12) : '', `${esc(x.status)}${x.next ? '<br>다음: ' + esc(x.next) : ''}`)).join('') || '<div class="empty">없어요</div>'}
     <div class="grp">대화방</div>${d.doing.sessions.slice(0, 8).map((x) => item(x.state === '내 답 기다림' ? 'warn' : x.state === '지금 작업 중' ? 'acc' : '', short(x.title, 28), ago(x.updatedAt), `${esc(x.state)}${x.ask ? '<br>' + esc(x.ask) : ''}`)).join('')}`)}
  ${sec('done', did.length + d.done.dev.length, false, '이번 주 한 일', `회의 ${d.done.meetings.length} · 슬랙 ${d.done.slack.length} · 같이 끝낸 일 ${d.done.dev.length}`,
    `${did.map((x) => item(x.state === '내 차례' ? 'warn' : 'acc', `${x.g} · ${short(x.what, 28)}`, mm(x.date), `${esc(x.what)}${x.todo && x.todo !== '-' ? '<br>내 할 일: ' + esc(x.todo) : ''}${x.link ? `<br><a href="${esc(x.link)}" target="_blank">원문</a>` : ''}`)).join('')}
     ${d.done.dev.slice(0, 8).map((x) => item('', short(x.what, 32), mm(x.date), `${esc(x.what)}${x.now && x.now !== '-' ? '<br>지금: ' + esc(x.now) : ''}`)).join('')}`)}
  ${sec('result', ov ? esc(ov.value) : '-', false, '성과', ov ? esc(short(ov.title, 24)) : '확인된 숫자 없음',
    `<div class="kpi">${d.results.overview.map((o) => `<div><b>${esc(o.value)}</b><span>${esc(short(o.title, 22))}</span></div>`).join('')}</div>
     ${d.results.perf ? item('acc', '지난주: ' + short(d.results.perf.line, 30), esc(d.results.perf.period), esc(d.results.perf.line)) : ''}
     ${d.results.expEnded.slice(0, 3).map((x) => item('', short(x.title.split('·').slice(1).join('·') || x.title, 30), '실험', esc(x.result))).join('')}`)}
  ${sec('auto', flagged.length, flagged.length > 0, '자동 작업 확인 필요', `지난 24시간 ${a.runs}번 돌았고 나머지는 정상`,
    flagged.map((g) => item('warn', short(g.name, 30), ago(g.latestAt), esc(g.latest))).join('') || '<div class="empty">다 정상이에요</div>')}
  ${d.links && d.links.length ? `<div class="links">${d.links.map((l) => `<a href="${esc(l.href)}">${esc(l.title)}</a>`).join('')}</div>` : ''}
  `;
  $('#app').innerHTML = html;
}
async function loadRemote() {
  const h = location.hash.replace(/^#/, '');
  if (h) { try { localStorage.setItem('hk', h); } catch {} }
  const key = h || (() => { try { return localStorage.getItem('hk'); } catch { return ''; } })();
  if (!key || !GIST) { $('#app').innerHTML = '<div class="lock">열쇠가 들어 있는 주소로 열어 주세요.</div>'; return; }
  let enc;
  try {
    const r = await fetch(`https://api.github.com/gists/${GIST}?t=${Date.now()}`, { cache: 'no-store' });
    const j = await r.json();
    const f = j.files['data.enc.json'];
    enc = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
  } catch (e) {
    const r = await fetch(`https://gist.githubusercontent.com/raw/${GIST}/data.enc.json?t=${Date.now()}`).catch(() => null);
    if (!r) { $('#app').innerHTML = '<div class="lock">데이터를 못 불러왔어요. 잠시 뒤 다시 열어 주세요.</div>'; return; }
    enc = await r.json();
  }
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const raw = b64(key.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((key.length + 3) % 4));
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, k, b64(enc.ct));
    render(JSON.parse(new TextDecoder().decode(pt)));
  } catch { $('#app').innerHTML = '<div class="lock">열쇠가 맞지 않아요. 처음 받은 주소로 다시 열어 주세요.</div>'; }
}
if (MODE === 'local' && DATA) { render(DATA); setTimeout(() => location.reload(), 10 * 60 * 1000); }
else { loadRemote(); setInterval(loadRemote, 5 * 60 * 1000); document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRemote(); }); }
</script>
</body>
</html>
